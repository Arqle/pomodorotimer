<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer & Study Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2255%22 font-size=%2280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>☕</text></svg>">

    <style>
        :root {
            --bg-color: #0b0f17;
            --panel-bg: rgba(15, 23, 42, 0.52); 
            --panel-border: rgba(255, 255, 255, 0.14);
            --card-sub: rgba(255, 255, 255, 0.07);
            
            --accent: #f97316; /* 集中: テラコッタオレンジ */
            --accent-subtle: rgba(249, 115, 22, 0.18);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-faint: #64748b;
            
            --font-ui: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body.mode-break {
            --accent: #10b981; /* 休憩: セージグリーン */
            --accent-subtle: rgba(16, 185, 129, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景スライド */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -2;
            filter: brightness(0.72) saturate(1.1);
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(11, 15, 23, 0.25) 0%, rgba(11, 15, 23, 0.75) 100%);
            z-index: -1;
        }

        /* トップバー */
        .top-bar {
            position: fixed;
            top: 20px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            pointer-events: none;
        }
        .top-bar > * {
            pointer-events: auto;
        }

        /* 撮影地タグ */
        .location-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 9999px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            letter-spacing: 0.02em;
        }

        /* 🌟 ミニYouTubeプレイヤーウィジェット (画面左下) */
        .yt-widget {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 12px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            z-index: 40;
            width: 260px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .yt-widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .yt-toggle-visibility-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 4px;
        }
        .yt-toggle-visibility-btn:hover {
            color: #ffffff;
        }
        .yt-screen-container {
            width: 100%;
            height: 135px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
            transition: height 0.3s ease, margin 0.3s ease;
        }
        .yt-widget.collapsed .yt-screen-container {
            height: 0;
            margin-bottom: 0;
        }
        .yt-screen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .yt-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .yt-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .yt-select option {
            background: #182234;
            color: #fff;
        }
        .yt-btns-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .yt-play-btn {
            background: #ffffff;
            color: #0b0f17;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.15s;
        }
        .yt-play-btn:hover {
            opacity: 0.9;
        }
        .yt-volume-slider {
            flex: 1;
            height: 4px;
            accent-color: #ffffff;
            cursor: pointer;
        }

        /* メインタイマーカード */
        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 32px 32px 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 10;
        }

        /* ヘッダーエリア */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .current-clock {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-action-btn {
            background: var(--card-sub);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .icon-action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* モード切り替えピル */
        .mode-pills {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .mode-pill {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-pill.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* タイマーサークル */
        .timer-viewport {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-viewport svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
        }
        .progress-meter-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }
        .progress-meter-val {
            stroke: var(--accent);
            transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
        }
        .timer-core-text {
            text-align: center;
            z-index: 2;
        }
        .timer-badge {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .timer-number {
            font-family: var(--font-mono);
            font-size: 4rem;
            font-weight: 500;
            letter-spacing: -0.04em;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* 進行中タスク表示 */
        .active-task-pill {
            font-size: 0.82rem;
            color: var(--text-main);
            background: var(--accent-subtle);
            border: 1px solid var(--panel-border);
            padding: 6px 16px;
            border-radius: 9999px;
            margin: 0 auto 24px;
            display: inline-block;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* 操作ボタン */
        .cta-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .primary-action-btn {
            flex: 2;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: #ffffff;
            color: #0b0f17;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .primary-action-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .secondary-action-btn {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            background: var(--card-sub);
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .secondary-action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.12);
        }

        /* タスク入力欄 */
        .task-input-wrapper {
            margin-bottom: 24px;
            text-align: left;
        }
        .task-input-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }
        .task-input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.88rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .task-input-field:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.35);
        }
        .task-input-field::placeholder {
            color: var(--text-faint);
        }

        /* サマリースタッツ */
        .minimal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
        .stat-col {
            text-align: left;
        }
        .stat-col:last-child {
            border-left: 1px solid var(--panel-border);
            padding-left: 14px;
        }
        .stat-col-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .stat-col-val {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 本日の達成履歴 */
        .history-section {
            border-top: 1px solid var(--panel-border);
            padding-top: 14px;
            text-align: left;
        }
        .history-section summary {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-section summary:hover {
            color: var(--text-main);
        }
        .history-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
        }
        .history-entry {
            background: var(--card-sub);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .history-entry-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .history-entry-time {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .history-entry-memo {
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-main);
            font-size: 0.78rem;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        /* モーダル */
        .modal-layer {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 23, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .modal-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal-box {
            background: rgba(24, 34, 53, 0.75);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 26px;
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }
        .modal-box h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box h3 button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .setting-inline {
            display: flex;
            gap: 8px;
        }
        .setting-select {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }
        .setting-test-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .logs-container {
            max-height: 280px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 16px;
        }
        .log-day-group {
            margin-bottom: 14px;
        }
        .log-day-header {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .log-day-item {
            font-size: 0.8rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }

        .danger-reset {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .danger-reset:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 4px; }

        @media (max-width: 768px) {
            .yt-widget {
                left: 16px;
                bottom: 16px;
                width: 220px;
            }
        }
    </style>
</head>
<body class="mode-work">

<!-- 背景レイヤー -->
<div id="bg-layer-1" class="bg-layer"></div>
<div id="bg-layer-2" class="bg-layer"></div>
<div class="bg-overlay"></div>

<!-- ヘッダーバー -->
<div class="top-bar">
    <div style="font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; color: var(--text-muted);">
        FOCUS SPACE
    </div>
    <div id="location-badge" class="location-tag">Loading...</div>
</div>

<!-- 🌟 YouTube プレイヤーウィジェット（画面左下・折りたたみ可能） -->
<div class="yt-widget" id="yt-widget">
    <div class="yt-widget-header">
        <span>📻 勉強用 BGM</span>
        <button id="yt-collapse-btn" class="yt-toggle-visibility-btn" title="最小化/展開">▼ 隠す</button>
    </div>
    <div class="yt-screen-container">
        <!-- YouTube IFrame はここに直接生成されます -->
        <div id="yt-player-box"></div>
    </div>
    <div class="yt-controls">
        <select id="bgm-playlist-select" class="yt-select">
            <option value="jfKfPfyJRdk">🎧 Lofi Girl - 勉強集中ラジオ</option>
            <option value="4xDzrJKXOOY">🎹 Relaxing Classical - ピアノ名曲</option>
            <option value="5qap5aO4i9A">🌧️ Gentle Rain - 静寂の雨と雷</option>
            <option value="Dx5qFachd3A">☕ Cozy Jazz Cafe - カフェの調べ</option>
            <option value="q0BVR5jRX4Q">🌌 Synthwave Radio - 深夜の作業</option>
        </select>
        <div class="yt-btns-row">
            <button id="bgm-toggle-btn" class="yt-play-btn">▶ 再生</button>
            <input type="range" id="bgm-volume-slider" class="yt-volume-slider" min="0" max="100" value="50" title="音量">
        </div>
    </div>
</div>

<!-- メインタイマーカード -->
<main class="app-container">
    <div class="card-header">
        <div id="datetime-display" class="current-clock">--:--:--</div>
        <div class="header-actions">
            <button class="icon-action-btn" id="open-logs-btn" title="過去の履歴">📊</button>
            <button class="icon-action-btn" id="open-settings-btn" title="設定">⚙️</button>
        </div>
    </div>

    <!-- モード切り替えピル -->
    <div class="mode-pills">
        <button id="mode-25" class="mode-pill active" onclick="changeTimerMode('pomodoro-25')">ポモドーロ 25m</button>
        <button id="mode-50" class="mode-pill" onclick="changeTimerMode('pomodoro-50')">ポモドーロ 50m</button>
        <button id="mode-sw" class="mode-pill" onclick="changeTimerMode('stopwatch')">ストップウォッチ</button>
    </div>

    <!-- タイマーサークル -->
    <div class="timer-viewport">
        <svg width="240" height="240">
            <circle class="progress-meter-bg" stroke-width="4" fill="transparent" r="112" cx="120" cy="120"/>
            <circle class="progress-meter-val" stroke-width="4" fill="transparent" r="112" cx="120" cy="120" stroke-linecap="round"/>
        </svg>
        <div class="timer-core-text">
            <div id="status" class="timer-badge">FOCUS</div>
            <div id="timer" class="timer-number">25:00</div>
        </div>
    </div>

    <div id="current-task-display" class="active-task-pill hidden"></div>

    <!-- 操作ボタン -->
    <div class="cta-row">
        <button id="toggleBtn" class="primary-action-btn">スタート</button>
        <button id="recordBtn" class="secondary-action-btn hidden">完了記録</button>
        <button id="resetBtn" class="secondary-action-btn">リセット</button>
    </div>

    <!-- タスク入力 -->
    <div class="task-input-wrapper">
        <label id="task-input-label" class="task-input-label">やることを設定</label>
        <input type="text" id="task-input" class="task-input-field" placeholder="例: レポートの構成を作成する">
    </div>

    <!-- サマリースタッツ -->
    <div class="minimal-stats">
        <div class="stat-col">
            <div class="stat-col-title">達成セッション</div>
            <div id="stat-total-count" class="stat-col-val">0 回</div>
        </div>
        <div class="stat-col">
            <div class="stat-col-title">合計作業時間</div>
            <div id="stat-total-time" class="stat-col-val">0分 0秒</div>
        </div>
    </div>

    <!-- 今日完了したタスク -->
    <details id="history-accordion" class="history-section">
        <summary id="history-count">本日の達成タスク (0)</summary>
        <div id="history-list" class="history-list"></div>
    </details>
</main>

<!-- 設定モーダル -->
<div id="settings-modal" class="modal-layer hidden">
    <div class="modal-box">
        <h3>設定 <button id="close-settings-btn">&times;</button></h3>
        
        <div class="setting-group">
            <label>アラーム音量</label>

    let ytPlayer = null;
    let isBgmPlaying = false;
    const bgmToggleBtn = document.getElementById('bgm-toggle-btn');
    const bgmSelect = document.getElementById('bgm-playlist-select');
    const bgmVolumeSlider = document.getElementById('bgm-volume-slider');
    const ytWidget = document.getElementById('yt-widget');
    const ytCollapseBtn = document.getElementById('yt-collapse-btn');

    // 折りたたみ制御
    ytCollapseBtn.addEventListener('click', () => {
        ytWidget.classList.toggle('collapsed');
        if (ytWidget.classList.contains('collapsed')) {
            ytCollapseBtn.textContent = '▲ 表示';
        } else {
            ytCollapseBtn.textContent = '▼ 隠す';
        }
    });

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player-box', {
            videoId: bgmSelect.value,
            playerVars: {
                playsinline: 1,
                controls: 1,
                modestbranding: 1,
                rel: 0
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.setVolume(parseInt(bgmVolumeSlider.value, 10));
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isBgmPlaying = true;
            bgmToggleBtn.textContent = '⏸ 停止';
        } else {
            isBgmPlaying = false;
            bgmToggleBtn.textContent = '▶ 再生';
        }
    }

    bgmToggleBtn.addEventListener('click', () => {
        if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
        if (isBgmPlaying) {
            ytPlayer.pauseVideo();
        } else {
            ytPlayer.playVideo();
        }
    });

    bgmSelect.addEventListener('change', (e) => {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        ytPlayer.loadVideoById(e.target.value);
        ytPlayer.playVideo();
    });

    bgmVolumeSlider.addEventListener('input', (e) => {
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {

        }
