<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer & Study Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2255%22 font-size=%2280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>☕</text></svg>">

    <style>
        :root {
            --bg-color: #0b0f17;
            /* 🌟 デフォルトで適度な半透明にし、背景が上品に透ける設計 */
            --panel-bg: rgba(15, 23, 42, 0.45); 
            --panel-border: rgba(255, 255, 255, 0.14);
            --card-sub: rgba(255, 255, 255, 0.07);
            
            --accent: #f97316; /* 集中: テラコッタオレンジ */
            --accent-subtle: rgba(249, 115, 22, 0.18);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-faint: #64748b;
            
            --font-ui: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body.mode-break {
            --accent: #10b981; /* 休憩: セージグリーン */
            --accent-subtle: rgba(16, 185, 129, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景スライド */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -2;
            filter: brightness(0.75) saturate(1.1);
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(11, 15, 23, 0.25) 0%, rgba(11, 15, 23, 0.75) 100%);
            z-index: -1;
        }

        /* トップバー */
        .top-bar {
            position: fixed;
            top: 20px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            pointer-events: none;
        }
        .top-bar > * {
            pointer-events: auto;
        }

        /* YouTube BGM プレイヤーバー */
        .bgm-widget {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 9999px;
            padding: 6px 14px 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        .bgm-btn {
            background: #ffffff;
            color: #0b0f17;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.15s ease, background-color 0.15s;
        }
        .bgm-btn:hover {
            transform: scale(1.05);
            background: #e2e8f0;
        }
        .bgm-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .bgm-select option {
            background: #182234;
            color: #fff;
        }
        .bgm-volume-slider {
            width: 60px;
            height: 4px;
            accent-color: #ffffff;
            cursor: pointer;
        }

        /* 撮影地タグ */
        .location-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 9999px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            letter-spacing: 0.02em;
        }

        /* メインカード（半透明＋すりガラス） */
        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 32px 32px 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 10;
        }

        /* ヘッダーエリア */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .current-clock {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-action-btn {
            background: var(--card-sub);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .icon-action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* モード切り替えピル */
        .mode-pills {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .mode-pill {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-pill.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* タイマーサークル */
        .timer-viewport {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-viewport svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
        }
        .progress-meter-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }
        .progress-meter-val {
            stroke: var(--accent);
            transition: stroke-dashoffset 0.25s linear, stroke 0.4s ease;
        }
        .timer-core-text {
            text-align: center;
            z-index: 2;
        }
        .timer-badge {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .timer-number {
            font-family: var(--font-mono);
            font-size: 4rem;
            font-weight: 500;
            letter-spacing: -0.04em;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* 進行中タスク表示 */
        .active-task-pill {
            font-size: 0.82rem;
            color: var(--text-main);
            background: var(--accent-subtle);
            border: 1px solid var(--panel-border);
            padding: 6px 16px;
            border-radius: 9999px;
            margin: 0 auto 24px;
            display: inline-block;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* 操作ボタン */
        .cta-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .primary-action-btn {
            flex: 2;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: #ffffff;
            color: #0b0f17;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .primary-action-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .secondary-action-btn {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            background: var(--card-sub);
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .secondary-action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.12);
        }

        /* タスク入力欄 */
        .task-input-wrapper {
            margin-bottom: 24px;
            text-align: left;
        }
        .task-input-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }
        .task-input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.88rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .task-input-field:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.35);
        }
        .task-input-field::placeholder {
            color: var(--text-faint);
        }

        /* サマリースタッツ */
        .minimal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
        .stat-col {
            text-align: left;
        }
        .stat-col:last-child {
            border-left: 1px solid var(--panel-border);
            padding-left: 14px;
        }
        .stat-col-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .stat-col-val {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 本日の達成履歴 */
        .history-section {
            border-top: 1px solid var(--panel-border);
            padding-top: 14px;
            text-align: left;
        }
        .history-section summary {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-section summary:hover {
            color: var(--text-main);
        }
        .history-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
        }
        .history-entry {
            background: var(--card-sub);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .history-entry-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .history-entry-time {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .history-entry-memo {
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-main);
            font-size: 0.78rem;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        /* モーダル */
        .modal-layer {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 23, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .modal-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal-box {
            background: rgba(24, 34, 53, 0.75);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 26px;
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }
        .modal-box h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box h3 button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .setting-inline {
            display: flex;
            gap: 8px;
        }
        .setting-select {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }
        .setting-test-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .logs-container {
            max-height: 280px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 16px;
        }
        .log-day-group {
            margin-bottom: 14px;
        }
        .log-day-header {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .log-day-item {
            font-size: 0.8rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }

        .danger-reset {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .danger-reset:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 4px; }
    </style>
</head>
<body class="mode-work">

<!-- 背景レイヤー -->
<div id="bg-layer-1" class="bg-layer"></div>
<div id="bg-layer-2" class="bg-layer"></div>
<div class="bg-overlay"></div>

<!-- ヘッダーバー: YouTube BGM & 背景地 -->
<div class="top-bar">
    <div class="bgm-widget">
        <button id="bgm-toggle-btn" class="bgm-btn" title="BGM 再生/停止">▶</button>
        <select id="bgm-playlist-select" class="bgm-select">
            <option value="jfKfPfyJRdk">🎧 Lofi Girl - 勉強集中ラジオ</option>
            <option value="mPZkdNFkNps">☕ Rainy Jazz Cafe - 雨音と珈琲</option>
            <option value="5qap5aO4i9A">🌧️ Gentle Rain - 静寂の雨と雷</option>
            <option value="4xDzrJKXOOY">🎹 Relaxing Classical - ピアノ名曲</option>
            <option value="4xDzrJKXOOY">🌌 Synthwave Radio - 深夜の作業</option>
        </select>
        <input type="range" id="bgm-volume-slider" class="bgm-volume-slider" min="0" max="100" value="40" title="BGM 音量">
    </div>

    <div id="location-badge" class="location-tag">Loading...</div>
</div>

<!-- 隠しYouTubeプレイヤー (API連携用) -->
<div style="position: absolute; left: -9999px; top: -9999px;">
    <div id="youtube-player"></div>
</div>

<!-- メインタイマーカード -->
<main class="app-container">
    <div class="card-header">
        <div id="datetime-display" class="current-clock">--:--:--</div>
        <div class="header-actions">
            <button class="icon-action-btn" id="open-logs-btn" title="過去の履歴">📊</button>
            <button class="icon-action-btn" id="open-settings-btn" title="設定">⚙️</button>
        </div>
    </div>

    <!-- モード切り替えピル -->
    <div class="mode-pills">
        <button id="mode-25" class="mode-pill active" onclick="changeTimerMode('pomodoro-25')">ポモドーロ 25m</button>
        <button id="mode-50" class="mode-pill" onclick="changeTimerMode('pomodoro-50')">ポモドーロ 50m</button>
        <button id="mode-sw" class="mode-pill" onclick="changeTimerMode('stopwatch')">ストップウォッチ</button>
    </div>

    <!-- タイマーサークル -->
    <div class="timer-viewport">
        <svg width="240" height="240">
            <circle class="progress-meter-bg" stroke-width="4" fill="transparent" r="112" cx="120" cy="120"/>
            <circle class="progress-meter-val" stroke-width="4" fill="transparent" r="112" cx="120" cy="120" stroke-linecap="round"/>
        </svg>
        <div class="timer-core-text">
            <div id="status" class="timer-badge">FOCUS</div>
            <div id="timer" class="timer-number">25:00</div>
        </div>
    </div>

    <div id="current-task-display" class="active-task-pill hidden"></div>

    <!-- 操作ボタン -->
    <div class="cta-row">
        <button id="toggleBtn" class="primary-action-btn">スタート</button>
        <button id="recordBtn" class="secondary-action-btn hidden">完了記録</button>
        <button id="resetBtn" class="secondary-action-btn">リセット</button>
    </div>

    <!-- タスク入力 -->
    <div class="task-input-wrapper">
        <label id="task-input-label" class="task-input-label">やることを設定</label>
        <input type="text" id="task-input" class="task-input-field" placeholder="例: レポートの構成を作成する">
    </div>

    <!-- サマリースタッツ -->
    <div class="minimal-stats">
        <div class="stat-col">
            <div class="stat-col-title">達成セッション</div>
            <div id="stat-total-count" class="stat-col-val">0 回</div>
        </div>
        <div class="stat-col">
            <div class="stat-col-title">合計作業時間</div>
            <div id="stat-total-time" class="stat-col-val">0分 0秒</div>
        </div>
    </div>

    <!-- 今日完了したタスク -->
    <details id="history-accordion" class="history-section">
        <summary id="history-count">本日の達成タスク (0)</summary>
        <div id="history-list" class="history-list"></div>
    </details>
</main>

<!-- 設定モーダル -->
<div id="settings-modal" class="modal-layer hidden">
    <div class="modal-box">
        <h3>設定 <button id="close-settings-btn">&times;</button></h3>
        
        <div class="setting-group">
            <label>アラーム音量</label>
            <input type="range" id="alarm-volume-slider" style="width:100%; height:4px; accent-color:var(--text-main);" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="setting-group">
            <label>作業完了音</label>
            <div class="setting-inline">
                <select id="work-sound-select" class="setting-select">
                    <option value="chime">チャイム (学校・駅風)</option>
                    <option value="digital">デジタルビープ</option>
                    <option value="melody">落ち着いたメロディ</option>
                    <option value="simple">ソフトベル</option>
                </select>
                <button class="setting-test-btn" onclick="testSound('work')">試聴</button>
            </div>
        </div>

        <div class="setting-group">
            <label>休憩完了音</label>
            <div class="setting-inline">
                <select id="break-sound-select" class="setting-select">
                    <option value="digital">デジタルビープ</option>
                    <option value="chime">チャイム</option>
                    <option value="melody">落ち着いたメロディ</option>
                    <option value="simple">ソフトベル</option>
                </select>
                <button class="setting-test-btn" onclick="testSound('break')">試聴</button>
            </div>
        </div>
    </div>
</div>

<!-- 過去全ログモーダル -->
<div id="logs-modal" class="modal-layer hidden">
    <div class="modal-box">
        <h3>全セッションログ <button id="close-logs-btn">&times;</button></h3>
        <div id="logs-container" class="logs-container"></div>
        <button id="danger-reset-btn" class="danger-reset">全蓄積ログを初期化</button>
    </div>
</div>

<!-- YouTube IFrame Player API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    /* ====================================================
       1. YouTube Background Music Controller
    ==================================================== */
    let ytPlayer = null;
    let isBgmPlaying = false;
    const bgmToggleBtn = document.getElementById('bgm-toggle-btn');
    const bgmSelect = document.getElementById('bgm-playlist-select');
    const bgmVolumeSlider = document.getElementById('bgm-volume-slider');

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('youtube-player', {
            height: '0',
            width: '0',
            videoId: bgmSelect.value,
            playerVars: {
                playsinline: 1,
                controls: 0,
                disablekb: 1,
                origin: window.location.origin
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.setVolume(parseInt(bgmVolumeSlider.value, 10));
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isBgmPlaying = true;
            bgmToggleBtn.textContent = '⏸';
        } else {
            isBgmPlaying = false;
            bgmToggleBtn.textContent = '▶';
        }
    }

    bgmToggleBtn.addEventListener('click', () => {
        if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
        if (isBgmPlaying) {
            ytPlayer.pauseVideo();
        } else {
            ytPlayer.playVideo();
        }
    });

    bgmSelect.addEventListener('change', (e) => {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        ytPlayer.loadVideoById(e.target.value);
        if (isBgmPlaying) {
            ytPlayer.playVideo();
        }
    });

    bgmVolumeSlider.addEventListener('input', (e) => {
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
            ytPlayer.setVolume(e.target.value);
        }
    });

    /* ====================================================
       2. 背景画像スライドショー
    ==================================================== */
    const bgData = [
        { url: "https://images.unsplash.com/photo-1505832018823-50331d70d237?q=80&w=2108&auto=format&fit=crop", name: "グレンフィナン高架橋, スコットランド" },
        { url: "https://images.unsplash.com/photo-1476610182048-b716b8518aae?q=80&w=1559&auto=format&fit=crop", name: "セリャラントスフォス, アイスランド" },
        { url: "https://images.unsplash.com/photo-1511300636408-a63a89df3482?q=80&w=2070&auto=format&fit=crop", name: "ヴェストラホルン, アイスランド" },
        { url: "https://images.unsplash.com/photo-1542224566-6e85f2e6772f?auto=format&fit=crop&w=1920&q=80", name: "ツェルマット, スイス" },
        { url: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=2070&auto=format&fit=crop", name: "ジアウ峠, イタリア" },
        { url: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=2070&auto=format&fit=crop", name: "ブライエス湖, イタリア" }
    ];

    let currentBgIndex = Math.floor(Math.random() * bgData.length);
    let activeLayer = 1;
    const layer1 = document.getElementById('bg-layer-1');
    const layer2 = document.getElementById('bg-layer-2');
    const locationBadge = document.getElementById('location-badge');

    layer1.style.backgroundImage = `url('${bgData[currentBgIndex].url}')`;
    layer1.style.opacity = 1;
    layer2.style.opacity = 0;
    locationBadge.textContent = bgData[currentBgIndex].name;

    function changeBackground() {
        currentBgIndex = (currentBgIndex + 1) % bgData.length;
        const nextImg = `url('${bgData[currentBgIndex].url}')`;
        const nextName = bgData[currentBgIndex].name;
        
        locationBadge.style.opacity = '0.3';
        setTimeout(() => {
            locationBadge.textContent = nextName;
            locationBadge.style.opacity = '1';
        }, 800);

        if (activeLayer === 1) {
            layer2.style.backgroundImage = nextImg; layer2.style.opacity = '1'; layer1.style.opacity = '0'; activeLayer = 2;
        } else {
            layer1.style.backgroundImage = nextImg; layer1.style.opacity = '1'; layer2.style.opacity = '0'; activeLayer = 1;
        }
    }
    setInterval(changeBackground, 120000);

    /* ====================================================
       3. Web Audio アラーム音
    ==================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const alarmGain = audioCtx.createGain();
    alarmGain.connect(audioCtx.destination);

    function playTone(freq, startTime, duration, type='sine') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(alarmGain);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    const sounds = {
        chime: () => {
            const now = audioCtx.currentTime;
            playTone(369.99, now, 1.2);
            playTone(293.66, now + 0.8, 1.2);
            playTone(329.63, now + 1.6, 1.2);
            playTone(220.00, now + 2.4, 1.8);
            return 3800;
        },
        digital: () => {
            const now = audioCtx.currentTime;
            for(let j=0; j<2; j++){
                let offset = now + j * 0.6;
                for(let i=0; i<3; i++){
                    playTone(880, offset + i * 0.1, 0.08, 'square');
                }
            }
            return 1200;
        },
        melody: () => {
            const now = audioCtx.currentTime;
            playTone(523.25, now, 0.3);
            playTone(659.25, now + 0.25, 0.3);
            playTone(783.99, now + 0.5, 0.5);
            return 1000;
        },
        simple: () => {
            playTone(587.33, audioCtx.currentTime, 0.8, 'sine');
            return 800;
        }
    };

    let workSoundType = localStorage.getItem('pomo_work_sound') || 'chime';
    let breakSoundType = localStorage.getItem('pomo_break_sound') || 'digital';
    let alarmVolume = localStorage.getItem('pomo_alarm_volume') || '0.5';

    alarmGain.gain.value = parseFloat(alarmVolume);
    document.getElementById('alarm-volume-slider').value = alarmVolume;
    document.getElementById('work-sound-select').value = workSoundType;
    document.getElementById('break-sound-select').value = breakSoundType;

    document.getElementById('alarm-volume-slider').addEventListener('input', (e) => {
        alarmGain.gain.value = parseFloat(e.target.value);
        localStorage.setItem('pomo_alarm_volume', e.target.value);
    });
    document.getElementById('work-sound-select').addEventListener('change', (e) => {
        workSoundType = e.target.value;
        localStorage.setItem('pomo_work_sound', workSoundType);
    });
    document.getElementById('break-sound-select').addEventListener('change', (e) => {
        breakSoundType = e.target.value;
        localStorage.setItem('pomo_break_sound', breakSoundType);
    });

    function testSound(mode) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(mode === 'work') sounds[workSoundType]();
        else sounds[breakSoundType]();
    }

    /* ====================================================
       4. タイマーコア機能
    ==================================================== */
    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');
    const taskInput = document.getElementById('task-input');
    const taskInputLabel = document.getElementById('task-input-label');
    const currentTaskDisplay = document.getElementById('current-task-display');
    const historyAccordion = document.getElementById('history-accordion');
    const historyCount = document.getElementById('history-count');
    const historyList = document.getElementById('history-list');
    const totalCountView = document.getElementById('stat-total-count');
    const totalTimeView = document.getElementById('stat-total-time');
    const logsContainer = document.getElementById('logs-container');
    const toggleBtn = document.getElementById('toggleBtn');
    const recordBtn = document.getElementById('recordBtn');
    const resetBtn = document.getElementById('resetBtn');

    const circle = document.querySelector('.progress-meter-val');
    const radius = circle.r.baseVal.value;
    const circumference = radius * 2 * Math.PI;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = 0;

    const WORK_TIME_25 = 25 * 60;
    const BREAK_TIME_25 = 5 * 60;
    const WORK_TIME_50 = 50 * 60;
    const BREAK_TIME_50 = 10 * 60;

    let timerMode = 'pomodoro-25';
    let isWorking = true;
    let timerId = null;
    let historyData = [];
    let currentTaskName = "";

    let startTimeStamp = null;
    let segmentStartTime = null;
    let baseTimeLeft = WORK_TIME_25;
    let actualWorkSeconds = 0;
    let totalTimeAccumulatedBeforePause = 0;
    let addedSecondsInSegment = 0;
    let thisSessionAddedSeconds = 0;

    function getTodayString() {
        const now = new Date();
        return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
    }

    function getTotalWorkSeconds() {
        return parseFloat(localStorage.getItem('pomo_total_seconds') || '0');
    }

    function addTotalWorkSeconds(sec) {
        let current = getTotalWorkSeconds();
        let next = Math.max(0, current + sec);
        localStorage.setItem('pomo_total_seconds', next);
    }

    function formatTotalTime(totalSeconds) {
        totalSeconds = Math.floor(totalSeconds);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return hours > 0 ? `${hours}h ${minutes}m ${seconds}s` : `${minutes}分 ${seconds}秒`;
    }

    function updateStatsDashboard() {
        totalCountView.textContent = `${localStorage.getItem('pomo_total_count') || '0'} 回`;
        totalTimeView.textContent = formatTotalTime(getTotalWorkSeconds());
    }

    function renderHistory() {
        historyList.innerHTML = '';
        historyCount.textContent = `本日の達成タスク (${historyData.length})`;
        if (historyData.length === 0) {
            historyList.innerHTML = '<div style="color:var(--text-faint); font-size:0.75rem; text-align:center; padding: 12px 0;">まだ達成タスクはありません</div>';
            return;
        }
        historyData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'history-entry';
            div.innerHTML = `
                <div class="history-entry-head">
                    <span>✓ ${item.task}</span>
                    <span class="history-entry-time">${item.timeRange || ''}</span>
                </div>
            `;
            const memo = document.createElement('textarea');
            memo.className = 'history-entry-memo';
            memo.placeholder = '振り返りメモ（自動保存）';
            memo.value = item.review || '';
            memo.addEventListener('input', (e) => {
                historyData[index].review = e.target.value;
                localStorage.setItem('pomo_history', JSON.stringify(historyData));
            });
            div.appendChild(memo);
            historyList.appendChild(div);
        });
    }

    function renderLogsModal() {
        logsContainer.innerHTML = '';
        let allLogs = JSON.parse(localStorage.getItem('pomo_all_logs') || '[]');
        if (allLogs.length === 0) {
            logsContainer.innerHTML = '<div style="color:var(--text-faint); font-size:0.8rem; text-align:center; padding:20px;">記録データはありません</div>';
            return;
        }
        allLogs.forEach(group => {
            const grp = document.createElement('div');
            grp.className = 'log-day-group';
            grp.innerHTML = `<div class="log-day-header">${group.date} (${group.items.length}回)</div>`;
            group.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'log-day-item';
                row.innerHTML = `<span>${item.task}</span><span style="color:var(--text-muted); font-size:0.75rem;">${item.timeRange}</span>`;
                grp.appendChild(row);
            });
            logsContainer.appendChild(grp);
        });
    }

    function updateDisplay(seconds) {
        if (seconds < 0) seconds = 0;
        let mins = Math.floor(seconds / 60);
        let secs = Math.floor(seconds % 60);
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (timerMode === 'stopwatch') {
            circle.style.strokeDashoffset = circumference - (((seconds % 60) / 60) * circumference);
        } else {
            const total = (timerMode === 'pomodoro-25') 
                ? (isWorking ? WORK_TIME_25 : BREAK_TIME_25)
                : (isWorking ? WORK_TIME_50 : BREAK_TIME_50);
            circle.style.strokeDashoffset = circumference - ((seconds / total) * circumference);
        }
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('datetime-display').textContent = 
            `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function switchMode() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        let delayMs = isWorking ? sounds[workSoundType]() : sounds[breakSoundType]();

        if (isWorking) {
            thisSessionAddedSeconds = 0;
            if (!startTimeStamp) {
                const targetLimit = (timerMode === 'pomodoro-25') ? WORK_TIME_25 : WORK_TIME_50;
                startTimeStamp = new Date(Date.now() - targetLimit * 1000);
                actualWorkSeconds = targetLimit;
            }

            const endTime = new Date();
            const fmt = (d) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const mins = Math.round(actualWorkSeconds / 60) || 1;
            const timeRangeStr = `${fmt(startTimeStamp)}~${fmt(endTime)} (${mins}m)`;
            const todayStr = getTodayString();

            historyData.unshift({ task: currentTaskName || '集中セッション', timeRange: timeRangeStr, review: '' });
            localStorage.setItem('pomo_history', JSON.stringify(historyData));

            let allLogs = JSON.parse(localStorage.getItem('pomo_all_logs') || '[]');
            let dayGroup = allLogs.find(g => g.date === todayStr);
            const logItem = { task: currentTaskName || '集中セッション', timeRange: timeRangeStr, minutes: mins };
            if (dayGroup) dayGroup.items.unshift(logItem);
            else allLogs.unshift({ date: todayStr, items: [logItem] });
            localStorage.setItem('pomo_all_logs', JSON.stringify(allLogs));

            localStorage.setItem('pomo_total_count', parseInt(localStorage.getItem('pomo_total_count') || '0') + 1);

            renderHistory();
            updateStatsDashboard();
            historyAccordion.open = true;
            taskInput.value = '';
            currentTaskDisplay.classList.add('hidden');
        }

        isWorking = !isWorking;
        baseTimeLeft = (timerMode === 'pomodoro-25') ? (isWorking ? WORK_TIME_25 : BREAK_TIME_25) : (isWorking ? WORK_TIME_50 : BREAK_TIME_50);
        document.body.className = isWorking ? "mode-work" : "mode-break";
        statusDisplay.textContent = isWorking ? "FOCUS" : "BREAK";

        startTimeStamp = null;
        segmentStartTime = null;
        actualWorkSeconds = 0;
        totalTimeAccumulatedBeforePause = 0;
        addedSecondsInSegment = 0;
        thisSessionAddedSeconds = 0;

        updateDisplay(baseTimeLeft);
        taskInput.disabled = false;
        setTimeout(startTimer, delayMs + 500);
    }

    function recordStopwatch() {
        if (timerMode !== 'stopwatch') return;
        const elapsed = timerId ? (Date.now() - segmentStartTime) / 1000 : 0;
        const total = baseTimeLeft + elapsed;
        if (total < 1) return;

        pauseTimer();
        thisSessionAddedSeconds = 0;

        const endTime = new Date();
        const startTime = new Date(endTime.getTime() - total * 1000);
        const fmt = (d) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const m = Math.round(total / 60);
        const s = Math.round(total % 60);
        const timeRangeStr = `${fmt(startTime)}~${fmt(endTime)} (${m > 0 ? m + 'm ' : ''}${s}s)`;
        const todayStr = getTodayString();
        const taskName = taskInput.value || '計測セッション';

        historyData.unshift({ task: taskName, timeRange: timeRangeStr, review: '' });
        localStorage.setItem('pomo_history', JSON.stringify(historyData));

        let allLogs = JSON.parse(localStorage.getItem('pomo_all_logs') || '[]');
        let dayGroup = allLogs.find(g => g.date === todayStr);
        const logItem = { task: taskName, timeRange: timeRangeStr, minutes: Math.round(total / 60) || 1 };
        if (dayGroup) dayGroup.items.unshift(logItem);
        else allLogs.unshift({ date: todayStr, items: [logItem] });
        localStorage.setItem('pomo_all_logs', JSON.stringify(allLogs));

        localStorage.setItem('pomo_total_count', parseInt(localStorage.getItem('pomo_total_count') || '0') + 1);

        renderHistory();
        baseTimeLeft = 0;
        updateDisplay(0);
        taskInput.value = '';
        currentTaskDisplay.classList.add('hidden');
        updateStatsDashboard();
        historyAccordion.open = true;
    }

    function startTimer() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if (timerId !== null) return;

        segmentStartTime = Date.now();
        addedSecondsInSegment = 0;

        if (timerMode === 'stopwatch') {
            currentTaskName = taskInput.value || '計測中';
            currentTaskDisplay.textContent = `⏱️ ${currentTaskName}`;
            currentTaskDisplay.classList.remove('hidden');
            if (!startTimeStamp) startTimeStamp = new Date();
        } else if (isWorking) {
            currentTaskName = taskInput.value || '集中中';
            currentTaskDisplay.textContent = `🎯 ${currentTaskName}`;
            currentTaskDisplay.classList.remove('hidden');
            if (!startTimeStamp) startTimeStamp = new Date();
        } else {
            currentTaskDisplay.textContent = `☕ Break Time`;
            currentTaskDisplay.classList.remove('hidden');
        }

        toggleBtn.textContent = "一時停止";

        timerId = setInterval(() => {
            const elapsed = (Date.now() - segmentStartTime) / 1000;
            if ((timerMode !== 'stopwatch' && isWorking) || timerMode === 'stopwatch') {
                const diff = elapsed - addedSecondsInSegment;
                if (diff > 0) {
                    addTotalWorkSeconds(diff);
                    addedSecondsInSegment = elapsed;
                    thisSessionAddedSeconds += diff;
                    updateStatsDashboard();
                }
            }

            if (timerMode === 'stopwatch') {
                updateDisplay(baseTimeLeft + elapsed);
            } else {
                if (isWorking) actualWorkSeconds = totalTimeAccumulatedBeforePause + elapsed;
                const currentLeft = baseTimeLeft - elapsed;
                if (currentLeft > 0) {
                    updateDisplay(currentLeft);
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    switchMode();
                }
            }
        }, 200);

        taskInput.disabled = true;
    }

    function pauseTimer() {
        if (timerId === null) return;
        clearInterval(timerId);
        timerId = null;
        taskInput.disabled = false;

        const elapsed = (Date.now() - segmentStartTime) / 1000;
        if (timerMode === 'stopwatch') {
            baseTimeLeft += elapsed;
        } else {
            baseTimeLeft -= elapsed;
            if (isWorking) totalTimeAccumulatedBeforePause += elapsed;
        }
        addedSecondsInSegment = 0;
        toggleBtn.textContent = "スタート";
    }

    function resetTimer() {
        pauseTimer();
        if (((timerMode !== 'stopwatch' && isWorking) || timerMode === 'stopwatch') && thisSessionAddedSeconds > 0) {
            addTotalWorkSeconds(-thisSessionAddedSeconds);
        }

        isWorking = true;
        baseTimeLeft = (timerMode === 'pomodoro-25') ? WORK_TIME_25 : (timerMode === 'pomodoro-50' ? WORK_TIME_50 : 0);
        startTimeStamp = null;
        segmentStartTime = null;
        actualWorkSeconds = 0;
        totalTimeAccumulatedBeforePause = 0;
        addedSecondsInSegment = 0;
        thisSessionAddedSeconds = 0;

        document.body.className = "mode-work";
        statusDisplay.textContent = timerMode === 'stopwatch' ? "STOPWATCH" : "FOCUS";
        currentTaskDisplay.classList.add('hidden');
        taskInput.disabled = false;
        updateDisplay(baseTimeLeft);
        toggleBtn.textContent = "スタート";
        updateStatsDashboard();
    }

    window.changeTimerMode = function(mode) {
        if (timerMode === mode) return;
        resetTimer();
        timerMode = mode;
        document.querySelectorAll('.mode-pill').forEach(el => el.classList.remove('active'));

        if (mode === 'pomodoro-25') {
            document.getElementById('mode-25').classList.add('active');
            taskInputLabel.textContent = "やることを設定";
            statusDisplay.textContent = "FOCUS";
            recordBtn.classList.add('hidden');
        } else if (mode === 'pomodoro-50') {
            document.getElementById('mode-50').classList.add('active');
            taskInputLabel.textContent = "やることを設定";
            statusDisplay.textContent = "FOCUS";
            recordBtn.classList.add('hidden');
        } else {
            document.getElementById('mode-sw').classList.add('active');
            taskInputLabel.textContent = "計測する作業";
            statusDisplay.textContent = "STOPWATCH";
            recordBtn.classList.remove('hidden');
        }
        resetTimer();
    };

    /* モーダル関連制御 */
    const settingsModal = document.getElementById('settings-modal');
    const logsModal = document.getElementById('logs-modal');

    document.getElementById('open-settings-btn').addEventListener('click', () => settingsModal.classList.remove('hidden'));
    document.getElementById('close-settings-btn').addEventListener('click', () => settingsModal.classList.add('hidden'));

    document.getElementById('open-logs-btn').addEventListener('click', () => {
        renderLogsModal();
        logsModal.classList.remove('hidden');
    });
    document.getElementById('close-logs-btn').addEventListener('click', () => logsModal.classList.add('hidden'));

    document.getElementById('danger-reset-btn').addEventListener('click', () => {
        if (confirm("すべての達成ログと累計時間を初期化しますか？")) {
            localStorage.clear();
            location.reload();
        }
    });

    toggleBtn.addEventListener('click', () => timerId ? pauseTimer() : startTimer());
    recordBtn.addEventListener('click', recordStopwatch);
    resetBtn.addEventListener('click', resetTimer);

    // 初期データロード
    const savedDate = localStorage.getItem('pomo_date');
    const today = getTodayString();
    if (savedDate !== today) {
        historyData = [];
        localStorage.setItem('pomo_date', today);
        localStorage.setItem('pomo_history', JSON.stringify([]));
    } else {
        historyData = JSON.parse(localStorage.getItem('pomo_history') || '[]');
    }

    renderHistory();
    updateStatsDashboard();
    updateDisplay(baseTimeLeft);
</script>
</body>
</html>
